overrides:
  "@ionic/core": npm:voyager-ionic-core@9.0.1

patchedDependencies:
  "@capacitor/haptics": patches/@capacitor__haptics.patch
  "@capacitor/keyboard@8.0.5": patches/@capacitor__keyboard@8.0.5.patch
  editate@0.6.27: patches/editate@0.6.27.patch
  openapi-fetch: patches/openapi-fetch.patch
  virtua@0.50.6: patches/virtua@0.50.6.patch

publicHoistPattern:
  - workbox-window

updateConfig:
  ignoreDependencies:
    - react-router
    - react-router-dom
    # TS 7 until typescript-eslint supports it (typescript-eslint#10940)
    - typescript

minimumReleaseAge: 0

allowBuilds:
  core-js: true
  esbuild: true
