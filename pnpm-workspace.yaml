overrides:
  "@ionic/core": file:../ionic-framework-v9/core

patchedDependencies:
  "@capacitor/haptics": patches/@capacitor__haptics.patch
  "@capacitor/keyboard@8.0.5": patches/@capacitor__keyboard@8.0.5.patch
  editate@0.6.26: patches/editate@0.6.26.patch
  openapi-fetch: patches/openapi-fetch.patch

publicHoistPattern:
  - workbox-window

updateConfig:
  ignoreDependencies:
    - react-router
    - react-router-dom
    # TS 7 until typescript-eslint supports it (typescript-eslint#10940)
    - typescript

minimumReleaseAge: 0

allowBuilds:
  core-js: true
  esbuild: true
