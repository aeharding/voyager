name: security

on:
  schedule:
    # Once every 24 hours, away from the busy start of the hour. Times are UTC.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-security
  cancel-in-progress: false

jobs:
  node_runtime:
    name: Node runtime audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Bootstrap the auditor with a supported, patched runtime, even if the pin is stale.
          node-version: lts/*
          check-latest: true
      - run: node .github/scripts/audit-node.mjs

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependency lockfiles, including development dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: node_modules,android/.gradle,src-tauri/target
          format: json
          output: dependency-vulnerabilities.json
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
      - name: Summarize and flag high or critical vulnerabilities
        run: python3 .github/scripts/security-summary.py dependency-vulnerabilities.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-vulnerabilities
          path: dependency-vulnerabilities.json
          if-no-files-found: error
          retention-days: 30

  containers:
    name: Container audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: published-runtime
            image: ghcr.io/aeharding/voyager:latest
          - name: build-runtime
            image: docker.io/library/node:lts-alpine
    steps:
      - uses: actions/checkout@v7
      - name: Scan container operating system and libraries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: json
          output: container-vulnerabilities.json
      - name: Summarize and flag high or critical vulnerabilities
        run: python3 .github/scripts/security-summary.py container-vulnerabilities.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-vulnerabilities-${{ matrix.name }}
          path: container-vulnerabilities.json
          if-no-files-found: error
          retention-days: 30

  fixes:
    name: Prepare security fix PRs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find security fixes and runtime patches
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/renovate-runner.cjs
          # Use the existing release credential so fix PRs trigger normal CI.
          token: ${{ secrets.PAT_TOKEN }}
          renovate-version: "44.181.4"
        env:
          LOG_LEVEL: info
